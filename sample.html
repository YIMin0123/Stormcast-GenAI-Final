<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>低面樣品間</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2430; font-family: system-ui, "Microsoft JhengHei", sans-serif; }
  canvas { display: block; touch-action: none; }
  #ui { position: fixed; top: 10px; left: 10px; width: 260px; max-width: calc(100vw - 32px); max-height: calc(100vh - 20px); overflow: auto;
        background: rgba(20, 26, 34, 0.82); color: #e8e4da; border-radius: 10px; padding: 10px 12px; font-size: 13px; box-sizing: border-box; }
  #ui h3 { margin: 0 0 6px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  #ui h3 button { font-size: 12px; }
  #ui.min .body { display: none; }
  .row { margin: 8px 0 2px; color: #b9b3a6; font-size: 12px; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  button { background: #2f3a48; color: #e8e4da; border: 1px solid #45536a; border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
  button.on { background: #c98b4c; border-color: #e0a76a; color: #1b1b1b; }
  input[type=range] { width: 100%; }
  #stats { position: fixed; right: 10px; top: 10px; background: rgba(20, 26, 34, 0.75); color: #e8e4da; padding: 6px 10px; border-radius: 8px;
           font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre; }
</style>
</head>
<body>
<div id="ui">
  <h3>低面樣品間 <button id="fold">收起</button></h3>
  <div class="body">
    <div class="row">場景</div><div class="seg" id="scene"></div>
    <div class="row">色板</div><div class="seg" id="pal"></div>
    <div class="row">時段 <b id="hourLab"></b></div>
    <input type="range" id="hour" min="4" max="22" step="0.1" />
    <div class="seg" id="hours"></div>
    <div class="row">陰影</div><div class="seg" id="shadow"></div>
    <div class="row">電腦加強（角落暗影、光束、光暈、邊緣光、草更遠）</div><div class="seg" id="hi"></div>
    <div class="row">抗鋸齒</div><div class="seg" id="aa"></div>
    <div class="row">鏡頭</div><div class="seg" id="cams"></div>
    <div class="row">檢查</div><div class="seg" id="dbg"></div>
  </div>
</div>
<div id="stats"></div>
<script type="module" src="./src/lowpoly/sample.js"></script>
</body>
</html>
