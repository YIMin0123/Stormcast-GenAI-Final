# multiplayer 分支（多人版，目前從這裡上線）有新的提交時，自動把網頁版打包好放上 GitHub Pages。
# 多人版合併進 main 之後，把下面的分支改回 main。
# 要先到 repo 的 Settings → Pages，把 Source 選成「GitHub Actions」（免費帳號的 repo 要公開才能用）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [multiplayer]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
